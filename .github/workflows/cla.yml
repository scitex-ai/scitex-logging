name: CLA Assistant

# Reusable-workflow migration (2026-07-10 incident remediation, see
# scitex-ai/scitex-stats PR #69 for the pilot pattern).
# Triggers/permissions preserved verbatim from the prior local file.
#
# owner_allowlist is overridden below because this repo's allowlist
# additionally includes "LLEmacs" (not part of the reusable workflow's
# "bot*,ywatanabe1989" default).
#
# NOTE: the prior local file hardcoded the CLA document link to the
# ecosystem-wide canonical https://github.com/ywatanabe1989/scitex-dev/
# blob/main/CLA.md. The reusable workflow instead builds the doc URL from
# the calling repo (${{ github.repository }}), so post-migration the link
# resolves to this repo's own CLA.md — verified byte-identical in content
# to scitex-dev's copy, so no substantive change for contributors.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  call:
    uses: scitex-ai/.github/.github/workflows/cla.yml@main
    # NOT `secrets: inherit`. The triggers above are attacker-triggerable:
    # anyone can comment on an issue or open a pull request, and unlike
    # `pull_request`, both `issue_comment` and `pull_request_target` run in
    # the BASE repo context with secrets available. `secrets: inherit` would
    # forward every secret this repo holds into that job — the fleet PAT
    # included — so an outsider's comment starts a job holding credentials it
    # has no use for. Pass the one secret the callee declares as required,
    # and nothing else: the blast radius of this workflow is then exactly the
    # CLA signature token, not the repo's whole secret store.
    secrets:
      GH_PERSONAL_ACCESS_TOKEN: ${{ secrets.GH_PERSONAL_ACCESS_TOKEN }}
    with:
      owner_allowlist: "bot*,ywatanabe1989,LLEmacs"
